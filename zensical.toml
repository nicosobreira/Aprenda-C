[project]
site_name = "Aprenda C"
site_description = "Um guia de programação em C que não esconde o que acontece por debaixo dos panos."
site_author = "Nícolas Sobreira Perez"
site_url = "https://nicosobreira.github.io/Aprenda-C/"
repo_url = "https://github.com/nicosobreira/Aprenda-C"
docs_dir = "docs"
site_dir = "site"

nav = [
  { "Início" = "index.md" },
  { "Primeiros passos" = [
    { "Instalando o C" = "modulos/instalacao.md" },
    { "Olá, Mundo" = "modulos/ola-mundo.md" },
    { "O que é C?" = "modulos/linguagem-c.md" },
  ] },
  { "Fundamentos" = [
    { "Variáveis" = "modulos/variaveis.md" },
    { "Exercícios: Variáveis" = "exercicios/variaveis.md"},
    { "Condicionais" = "modulos/condicionais.md" },
    { "Exercícios: Condicionais" = "exercicios/condicionais.md" },
    { "Estruturas de Repetição" = "modulos/repeticao.md" },
    { "Exercícios: Repetição" = "exercicios/repeticao.md" },
    { "Funções" = "modulos/funcoes.md"},
    { "Exercícios: Funções" = "exercicios/funcoes.md"},
    { "Listas" = "modulos/listas.md"},
    { "Exercícios: Listas" = "exercicios/listas.md"}
  ] },
{ "Avançado" = [
    {"Memoria I" = "modulos/memoria-1.md"},
    ] }


]

extra_javascript = [
  "javascripts/admonitions.js",
  "javascripts/katex.js",
  "https://unpkg.com/katex@0/dist/katex.min.js",
  "https://unpkg.com/katex@0/dist/contrib/auto-render.min.js",
]
extra_css = [
  "https://unpkg.com/katex@0/dist/katex.min.css",
]

[project.theme]
language = "pt-BR"
features = [
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.tracking",
  "navigation.sections",
  "navigation.top",
  "navigation.footer",
  "toc.follow",
  "search.highlight",
  "content.tabs.link",
  "content.code.annotate",
  # "content.code.copy",  # botão de copiar, desligado por causa da regra "digite cada código"
]

# Modo automático / claro / escuro
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Mudar para o modo claro"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Mudar para o modo escuro"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Usar a preferência do sistema"

# --- Extensões de Markdown (lista completa, ver aviso acima) ---
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.snippets]
auto_append = [
    "includes/abbreviations.md",
]

[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
